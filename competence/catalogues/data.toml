# Skill catalogue for data teams (R, Python, git/GitHub and the general data skills around them).
# Loaded once by `competence init`; after that the database is the source of truth: edit in Admin.
#
# Targets use the scale 0, 1, 2, 3, 5, 8 and are the author's judgement, not an external standard.
# A skill's target for a role is its category's default unless the skill lists its own.
# Leave a role out of a category's targets for "no target" (blank), which is not the same as 0.
# Priority and experts needed are derived from the targets (see core/catalogue.py); change them in Admin.

# Codes are only used inside this file, as keys in `targets`.
roles = [
  { code = "DA", name = "Data Analyst" },
  { code = "DS", name = "Data Scientist" },
  { code = "DE", name = "Data Engineer" },
  { code = "AE", name = "Analytics Engineer" },
  { code = "ST", name = "Statistician" },
  { code = "RSE", name = "Research Software Engineer" },
  { code = "MLE", name = "ML Engineer" },
  { code = "DM", name = "Data Manager / Steward" },
  { code = "LEAD", name = "Data Team Lead" },
]

